<div class="projects-container">
  <h2 class="page-title pt-10 text-cyan-500">Projects</h2>

  <div class="projects-grid">
    <div class="project-card" *ngFor="let project of projects">
      <img [src]="project.image" [alt]="project.title" class="project-image" />

      <div class="project-info">
        <h3>{{ project.title }}</h3>
        <p>{{ project.description }}</p>

        <div class="tech-list">
          <span *ngFor="let tech of project.techStack">{{ tech }}</span>
        </div>

        <div class="project-links">
          <a [href]="project.demoLink" target="_blank" class="btn bg-cyan-500">View Demo</a>

          <a *ngFor="let link of project.githubLink" [href]="project.githubLink" target="_blank" class="btn-outline">GitHub</a>
        </div>
      </div>
    </div>
  </div>
</div>
