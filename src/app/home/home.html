<div class="home-container min-h-screen flex items-center justify-center">
  <div class="main-content w-full max-w-6xl px-4 md:px-12">
    
    <!-- Section A: Centered -->
    <section
      class="sectionA flex flex-col md:flex-row items-center md:items-start justify-center gap-10 w-full"
    >
      <div class="text-center text-cyan-500 md:text-left" data-aos="zoom-in">
        <h1 class="font-cursive text-4xl mb-4" data-aos="zoom-in">
          👋 Hello! I'm
        </h1>
        <p class="font-classic name text-7xl font-bold" >Gayatri Dutta</p>
        <div class="font-cursive mt-3">
          <p class="text-2xl">I am a</p>
          <p
            class="pt-1 text-4xl font-classic profile uppercase"
            [class.fade]="fade"
          >
            {{ currentText }}
          </p>
        </div>
      </div>
    </section>

    <!-- Section B -->
    <section class="sectionB text-center pt-10 lg:pt-20" data-aos="zoom-in">
      <h1 class="font-cursive text-cyan-500 text-5xl mb-4">I break things ....</h1>
      <p class="font-cursive text-cyan-500 text-2xl px-5">
        then fix them (sometimes into something better)
      </p>
      <div class="pb-6">
        <a
          href="../assets/resume.pdf"
          target="_blank"
          class="mt-6 inline-block bg-cyan-500 text-white px-6 py-2 rounded hover:bg-cyan-500 transition"
        >
          Click to Download My Resume  
        </a>
      </div>
    </section>
   

    <p class=" text-cyan-500 text-center text-xl pt-10">
       Scroll Down For More ⬇️
      </p>
  </div>
</div>
