<div *ngIf="loading" class="fixed inset-0 bg-white/50 w-full h-full z-50 flex flex-col items-center justify-center bg-white dark:bg-gray-900">
  <!-- 3D Cube Container -->
  <div class="cube-container w-24 h-24 perspective-1000">
    <div class="cube w-full h-full">
      <div class="face face-front bg-blue-500"></div>
      <div class="face face-back bg-green-500"></div>
      <div class="face face-right bg-purple-500"></div>
      <div class="face face-left bg-pink-500"></div>
      <div class="face face-top bg-yellow-400"></div>
      <div class="face face-bottom bg-indigo-500"></div>
    </div>
  </div>

  <!-- Loader text -->
  <p class="mt-6 text-gray-700 dark:text-gray-200 text-lg font-semibold animate-pulse">
    Loading portfolio...
  </p>
</div>
