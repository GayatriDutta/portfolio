<div
  class="fixed inset-0 bg-gradient-to-br from-gray-400 via-gray-600 to-gray-900 flex items-center justify-center z-50"
>
  <div class="text-center">
    <div class="perspective-container mb-12">
      <div class="cube">
        <div class="cube-face front"></div>
        <div class="cube-face back"></div>
        <div class="cube-face right"></div>
        <div class="cube-face left"></div>
        <div class="cube-face top"></div>
        <div class="cube-face bottom"></div>
      </div>
    </div>

    <div class="flex items-center justify-center gap-6 mb-8">
      <span
        *ngFor="let letter of letters; let index = index"
        [ngStyle]="{ animationDelay: index * 0.1 + 's' }"
        class="text-4xl font-bold text-cyan-400 animate-letter-bounce"
      >
        {{ letter }}
      </span>
    </div>

    <div class="w-64 h-1 bg-gray-700 rounded-full overflow-hidden mx-auto">
      <div
        class="h-full bg-gradient-to-r from-gray-500 via-cyan-400 to-cyan-500 animate-loader-progress"
      ></div>
    </div>
  </div>
</div>
