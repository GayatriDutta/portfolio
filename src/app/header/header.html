<nav
  class="bg-gray-400 header min-w-screen"
  [ngClass]="{ scrolled: isScrolled }"
>
  <div class="container flex">
    <div class="flex flex-row gap-3 mt-2 logo">
      <div routerLink="" class="w-10 pl-2">
        <img class="" src="/assets/logo.png" />
      </div>
      <a href="#" class=" tag-line text-2xl font-semibold" [ngClass]="{ scrolled: isScrolled }"
        >Welcome to my code world !</a
      >
       <a href="#" class="name-line  text-2xl font-semibold" [ngClass]="{ scrolled: isScrolled }"
        >Gayatri Dutta </a
      >
    </div>
    <div class="flex justify-center items-center " class="hamburger" (click)="showMenudropdown = !showMenudropdown"><img class="rounded-full w-10 pt-1" src="assets/hamburger.png"  ></div>
    <ul *ngIf="showMenu()" (click)="showMenudropdown = !showMenudropdown" class="flex gap-[3vw] justify-space menu" [ngClass]="{}">
      <li class="header-tab" >
        <a routerLink="" class=" tab-pill text-cyan-500 border-b-1 font-bold" [ngClass]="{ scrolled: isScrolled }"
          > Home</a
        >
      </li>
      <li class="header-tab">
        <a routerLink="" fragment="about" class="tab-pill text-cyan-500 border-b-1 font-bold" [ngClass]="{ scrolled: isScrolled }"
          >About</a
        >
      </li>
      <li class="header-tab">
        <a routerLink="" fragment="skills" class=" tab-pill text-cyan-500 border-b-1 font-bold" [ngClass]="{ scrolled: isScrolled }"
          >Skills</a
        >
      </li>
      <li class="header-tab">
        <a routerLink="" fragment="projects" class=" tab-pill text-cyan-500 border-b-1 font-bold" [ngClass]="{ scrolled: isScrolled }"
          >Projects</a
        >
      </li>
      <li class="header-tab">
        <a routerLink="" fragment="exper" class=" tab-pill text-cyan-500 border-b-1 font-bold" [ngClass]="{ scrolled: isScrolled }"
          >Experience</a
        >
      </li>
      <li class="header-tab">
        <a routerLink="" fragment="contact" class="tab-pill text-cyan-500 border-b-1" [ngClass]="{ scrolled: isScrolled }"
          >Contact</a
        >
      </li>
    </ul>
  </div>
</nav>
